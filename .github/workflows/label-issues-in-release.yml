name: Label issues in release

on:
    workflow_dispatch:
        inputs:
            tag:
                description: 'Release tag'
                required: true
                type: string
            label_name:
                description: 'Name of the label'
                required: true
                type: string
            label_description:
                description: 'Description of the label'
                default: ''
                required: false
                type: string
            label_color:
                description: 'A color of the added label'
                default: 'FFFFFF'
                required: false
                type: string
            dry_run:
                description: 'List the PRs and issues without labeling them'
                default: false
                required: false
                type: boolean
    workflow_call:
        inputs:
            tag:
                description: 'Release tag'
                required: true
                type: string
            label_name:
                description: 'Name of the label'
                required: true
                type: string
            label_description:
                description: 'Description of the label'
                default: ''
                required: false
                type: string
            label_color:
                description: 'A color of the added label'
                default: 'FFFFFF'
                required: false
                type: string
            dry_run:
                description: 'List the PRs and issues without labeling them'
                default: false
                required: false
                type: boolean
        outputs:
            issues:
                description: "JSON encoded list of issues linked to the PRs in the release"
                value: ${{ jobs.run.outputs.issues }}

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
    run:
        name: Run
        runs-on: ubuntu-latest
        outputs:
            issues: ${{ steps.label.outputs.issues }}
        steps:
            # Full history and tags: the tool computes the previous tag and the commit range from the checkout.
            -   name: Checkout repo
                uses: actions/checkout@v4
                with:
                    fetch-depth: 0

            -   name: Install pnpm
                uses: pnpm/action-setup@v6
                with:
                    version: 12.4.1
                    cache: true

            -   name: Setup node
                uses: actions/setup-node@v4
                with:
                    node-version: 24.21.0
                    cache: 'pnpm'

            -   name: Install dependencies
                run: pnpm install --frozen-lockfile

            -   name: Label PRs and issues
                id: label
                run: |
                    issues=$(pnpm --silent release label "$TAG" --label="$LABEL_NAME" --description="$LABEL_DESCRIPTION" --color="$LABEL_COLOR" $DRY_RUN_FLAG)
                    echo "issues=$issues" >> "$GITHUB_OUTPUT"
                env:
                    GH_TOKEN: ${{ github.token }}
                    TAG: ${{ inputs.tag }}
                    LABEL_NAME: ${{ inputs.label_name }}
                    LABEL_DESCRIPTION: ${{ inputs.label_description }}
                    LABEL_COLOR: ${{ inputs.label_color }}
                    DRY_RUN_FLAG: ${{ inputs.dry_run && '--dry-run' || '' }}
