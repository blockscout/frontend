name: Pre-release

on:
    workflow_dispatch:
    push:
        tags:
            - 'v[0-9]+.[0-9]+.[0-9]+-[a-z]+*' # e.g v1.2.3-alpha.2

jobs:
    checks:
        name: Run code checks
        uses: "./.github/workflows/checks.yml"
        secrets: inherit
        permissions:
          contents: read
          pull-requests: write

    check_tag:
        name: Check release tag
        uses: './.github/workflows/check-tag.yml'
        with:
            tag: ${{ github.ref_name }}
        # The line's pre-release is still a draft at an alpha, and only push access lists drafts.
        permissions:
            contents: write
            issues: read
            pull-requests: read

    publish_image:
        name: Publish Docker image
        needs: check_tag
        uses: './.github/workflows/publish-image.yml'
        secrets: inherit
        with:
            platforms: linux/amd64

    # e2e_tests:
    # decided to disable e2e temporarily
    #     name: Run e2e tests
    #     needs: checks
    #     uses: "./.github/workflows/e2e-tests.yml"
    #     secrets: inherit
    #     permissions: write-all

    label_issues:
        name: Add pre-release label to PRs and issues
        uses: './.github/workflows/label-issues-in-release.yml'
        with:
            tag: ${{ github.ref_name }}
            label_name: 'pre-release'
            label_description: Tasks in pre-release right now
        secrets: inherit
        permissions:
          contents: read
          issues: write
          pull-requests: write
