# Required for `pnpm deploy` in the Docker image (favicon/sitemap generators).
# pnpm 11+ reads this from pnpm-workspace.yaml only — not from .npmrc.
injectWorkspacePackages: true

packages:
  - 'src/toolkit/package'
  - 'deploy/tools/envs-validator'
  - 'deploy/tools/feature-reporter'
  - 'deploy/tools/favicon-generator'
  - 'deploy/tools/sitemap-generator'
  - 'deploy/tools/multichain-config-generator'
  - 'deploy/tools/essential-dapps-chains-config-generator'
  - 'deploy/tools/llms-txt-generator'

verifyDepsBeforeRun: warn

# The widget-light EVM handler is patched for these wagmi v2 / viem versions.
# Resolve wallet clients per request; explicit chainId supports syncConnectedChain: false.
peerDependencyRules:
  allowedVersions:
    '@lifi/widget-light@4.3.2>wagmi': '2.19.5'
    '@lifi/widget-light@4.3.2>@wagmi/core': '2.22.1'
    '@lifi/widget-light@4.3.2>viem': '2.41.2'

overrides:
  '@wagmi/connectors': "6.2.0"
  ws: "8.21.0"
  axios: "1.12.0"
  tar-fs: "2.1.4"
  node-forge: "1.3.2"
  brace-expansion: "1.1.12"
  js-yaml: "4.1.1"
  "@noble/hashes": "1.8.0"
  "vite-plugin-dts>brace-expansion": "2.0.2"
  "minimatch@10>brace-expansion": "5.0.9"
  protobufjs: "7.5.5"

# pnpm 11+: allowlisted dependency install scripts (required for native addons).
# Replaces pnpm 10's onlyBuiltDependencies — same policy: only these two packages may run build scripts.
allowBuilds:
  '@ipshipyard/node-datachannel': true
  '@reown/appkit': false
  '@scarf/scarf': false
  '@specify-sh/sdk': false
  '@tree-sitter-grammars/tree-sitter-yaml': false
  bigint-buffer: false
  bufferutil: false
  core-js: false
  core-js-pure: false
  esbuild: false
  iso-constants: false
  keccak: false
  protobufjs: false
  sharp: true
  tree-sitter: false
  tree-sitter-json: false
  tsl-apple-cloudkit: false
  unrs-resolver: false
  utf-8-validate: false

minimumReleaseAge: 10080 # 1 week
minimumReleaseAgeExclude:
  # permanent
  - '@blockscout/admin-rs-types'
  - '@blockscout/api-types'
  - '@blockscout/bens-types'
  - '@blockscout/contracts-info-types'
  - '@blockscout/interchain-indexer-types'
  - '@blockscout/multichain-aggregator-types'
  - '@blockscout/points-types'
  - '@blockscout/stats-types'
  - '@blockscout/tac-operation-lifecycle-types'
  - '@blockscout/visualizer-types'
  - '@blockscout/zetachain-cctx-types'

patchedDependencies:
  '@lifi/widget-light@4.3.2': patches/@lifi__widget-light@4.3.2.patch
