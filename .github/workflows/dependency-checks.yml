name: Dependency checks

# Checks for a pull request that changes dependencies. Every dependency edit, in package.json or in the
# overrides of pnpm-workspace.yaml, rewrites pnpm-lock.yaml, so the lockfile is the one trigger. The
# regular checks stay change-scoped and run no unit tests on a lockfile-only pull request; this workflow
# runs the whole suite instead, builds the app for production to run the smoke set against it, and audits
# the runtime dependencies. It is not a required check for merging into main.
on:
  workflow_dispatch:
  pull_request:
    # Draft pull requests run too, for now: this workflow can only be dispatched once it is on main, so
    # the pull request that adds it is where it gets its first runs. It takes the draft skip of checks.yml
    # once those runs are confirmed.
    types: [ opened, synchronize, reopened ]
    paths:
      - 'pnpm-lock.yaml'

permissions:
  contents: read

jobs:
  vitest_tests:
    name: Unit tests (full suite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.4.1
          cache: true

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Spec files run in random order, as in checks.yml. The run prints its seed;
      # `--sequence.seed <seed>` replays the order locally.
      - name: Run Vitest
        run: pnpm test:vitest --sequence.shuffle.files

  build_and_smoke:
    name: Production build and smoke run
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # If GitHub runners cannot reach staging, the fallback is eth_sepolia.
      PRESET: staging
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # The run scripts read the last release tag with `git describe`. A shallow clone has none, and
          # the empty value they then pass to dotenv-cli fails the build.
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.4.1
          cache: true

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The browser comes from the installed @playwright/test, so it follows the lockfile instead of an
      # image tag pinned by hand, as the component tests' container in checks.yml is.
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps --only-shell chromium

      # The build is the production-build check. It is a step of its own, apart from the smoke run, so
      # the run's summary tells a broken build from a failed smoke test. The two steps are what
      # `pnpm test:smoke` runs locally in one go.
      - name: Build for production
        run: pnpm prod:preset "$PRESET" --build-only

      - name: Run the smoke set
        id: smoke
        run: pnpm test:smoke "$PRESET" --skip-build

      - name: Upload the smoke report
        if: ${{ failure() && steps.smoke.outcome == 'failure' }}
        uses: actions/upload-artifact@v5
        with:
          name: smoke-report
          path: |
            tools/smoke/report
            tools/smoke/results
          retention-days: 7

  audit:
    name: Vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.4.1
          cache: true

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fails on a runtime dependency with a high or critical advisory; development dependencies and
      # lower severities are reported without failing. An advisory the team lives with is skipped by an
      # entry in the `audit.ignore` setting of pnpm-workspace.yaml, with its reason, so this step passes
      # no ignore of its own. It runs only here, not in checks.yml: it reads the whole lockfile against
      # the live advisory database, so there it would fail pull requests unrelated to the advisory.
      - name: Audit runtime dependencies
        run: pnpm audit --prod --audit-level high
